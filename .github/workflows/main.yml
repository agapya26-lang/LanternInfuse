name: Build FrostingCore

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package
        working-directory: ./FrostingCore-source/FrostingCore

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostingCore
          path: FrostingCore-source/FrostingCore/target/FrostingCore-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow runs
        uses: actions/download-artifact@v4
        with:
          name: FrostingCore
          path: ./released-jar

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./released-jar/FrostingCore-*.jar
          generate_release_notes: true
