name: Build LanternInfuse
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: |
          set -e
          mkdir -p /tmp/unz
          for z in $(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*'); do unzip -q -o "$z" -d /tmp/unz || true; done
          JAVADIR=$(find . /tmp/unz -maxdepth 6 -type d -path '*/src/main/java' -not -path './.git/*' 2>/dev/null | head -n 1)
          if [ -z "$JAVADIR" ]; then
            echo "ERROR: no src/main/java folder found. Files in the repo:"
            find . -not -path './.git/*' | head -80
            exit 1
          fi
          PROJ=$(dirname "$(dirname "$(dirname "$JAVADIR")")")
          echo "Building project in $PROJ"
          mvn -B -f "$PROJ/pom.xml" package
          mkdir -p out
          cp "$PROJ"/target/LanternInfuse-*.jar out/
          echo "Jar size: $(stat -c %s out/LanternInfuse-*.jar) bytes"
          unzip -l out/LanternInfuse-*.jar | grep -q 'plugin.yml' || { echo "ERROR: the jar has no plugin.yml"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: LanternInfuse
          path: out/*.jar
