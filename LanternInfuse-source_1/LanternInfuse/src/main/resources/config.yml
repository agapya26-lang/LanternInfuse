# Colour codes use & (and &#RRGGBB for hex).

prefix: "&8[&6Lantern&eLight+&8] &7"

settings:
  actionbar: true                 # show the cooldown HUD above the hotbar
  default-controls: offhand       # offhand = F (slot 1) / Shift+F (slot 2), or commands = /lspark /rspark
  broadcast-craft: true           # announce when an effect is crafted
  broadcast-coordinates: true     # include the crafting location in the announcement
  # What the effect bottles look like. Anything that is an item works. Good picks:
  #   SPLASH_POTION | LINGERING_POTION | POTION   (these get tinted with each effect's colour)
  #   HONEY_BOTTLE | DRAGON_BREATH | EXPERIENCE_BOTTLE | OMINOUS_BOTTLE   (fixed look, no tint)
  # You can also set  bottle: <TYPE>  inside a single effect below to override just that one.
  # Only newly created bottles change - run /infuse reload, then re-give/re-craft.
  bottle: SPLASH_POTION
  augmented-first-craft: true     # the very first craft of each effect is Augmented (half cooldown, stronger spark)
  max-normal-crafts: 3            # normal crafts allowed per effect AFTER the augmented one
  spark-radius: 16                # radius for Thunder / Regen / Invis sparks
  ocean-radius: 15                # radius for the Ocean spark
  fire-launch-strength: 1.8       # how hard the Fire spark launches you upward
  ocean-drown-damage: 1.0         # damage per pulse of the Ocean spark
  thunder-smite-damage: 3.0       # damage per lightning smite
  death:
    mode: DROP                    # DROP = equipped effects drop as items | KEEP = keep them | LOSE = destroyed
    reset-cooldowns: true

